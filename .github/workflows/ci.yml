name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting (Biome + Prettier)
        run: bun run format:check

      - name: Lint (Biome + markdownlint + SKILL.md schema)
        run: bun run lint

      - name: Verify marketplace skill symlinks are up to date
        run: |
          ./scripts/link-marketplace-skills.sh
          if [ -n "$(git status --porcelain .claude/skills .agents/skills)" ]; then
            echo "ERROR: marketplace skill symlinks are out of date."
            echo "Run ./scripts/link-marketplace-skills.sh locally and commit the result."
            git status --porcelain .claude/skills .agents/skills
            exit 1
          fi
