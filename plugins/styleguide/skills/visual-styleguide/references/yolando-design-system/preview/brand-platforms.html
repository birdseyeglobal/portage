<!doctype html><html><head><meta charset="utf-8">
<title>Platform chips</title><link rel="stylesheet" href="_base.css">
<style>
  body{padding:24px;display:flex;flex-direction:column;gap:14px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .label{font-family:var(--fontFamily-headings);font-size:11px;color:var(--content-subtlest);text-transform:uppercase;letter-spacing:.08em;width:100%;font-weight:var(--fontWeight-semibold)}
  .chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;border:1px solid var(--border-default);border-radius:var(--borderRadius-round);background:#fff;font-family:var(--fontFamily-headings);font-weight:var(--fontWeight-medium);font-size:13px;color:var(--content-default);letter-spacing:-.14px}
  .logo{width:16px;height:16px;flex-shrink:0;display:block}
  .chip.sel{background:var(--color-grey-1000);color:#fff;border-color:var(--color-grey-1000)}
  .chip.sel .logo path,.chip.sel .logo circle,.chip.sel .logo rect{}
  .bar{display:flex;height:28px;border-radius:var(--borderRadius-200);overflow:hidden;background:var(--color-grey-100);width:100%;position:relative}
  .seg{display:flex;align-items:center;gap:6px;padding:0 10px;color:#fff;font-family:var(--fontFamily-body);font-size:12px;font-weight:500;letter-spacing:-.08px}
  .seg .logo{width:12px;height:12px}
  .allbadge{width:16px;height:16px;border-radius:var(--borderRadius-100);background:var(--color-purple-300);color:var(--color-grey-1000);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:var(--fontWeight-bold)}
</style>

<!-- SVG symbols for LLM platform marks -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- OpenAI / ChatGPT · hexagonal knot -->
    <symbol id="logo-chatgpt" viewBox="0 0 24 24">
      <path fill="#10A37F" d="M22.282 9.821a5.985 5.985 0 0 0-.516-4.91 6.046 6.046 0 0 0-6.51-2.9A6.065 6.065 0 0 0 4.981 4.18a5.985 5.985 0 0 0-3.998 2.9 6.046 6.046 0 0 0 .743 7.097 5.98 5.98 0 0 0 .51 4.911 6.051 6.051 0 0 0 6.515 2.9A5.985 5.985 0 0 0 13.26 24a6.056 6.056 0 0 0 5.772-4.206 5.99 5.99 0 0 0 3.997-2.9 6.056 6.056 0 0 0-.747-7.073zm-9.022 12.636a4.485 4.485 0 0 1-2.876-1.04l.141-.081 4.779-2.758a.795.795 0 0 0 .392-.681v-6.737l2.02 1.168a.071.071 0 0 1 .038.052v5.583a4.504 4.504 0 0 1-4.494 4.494zM3.6 18.304a4.47 4.47 0 0 1-.535-3.014l.142.085 4.783 2.759a.771.771 0 0 0 .78 0l5.843-3.369v2.332a.08.08 0 0 1-.033.062L9.74 19.95a4.5 4.5 0 0 1-6.14-1.646zM2.34 7.896a4.485 4.485 0 0 1 2.366-1.973v5.68a.766.766 0 0 0 .388.676l5.815 3.355-2.02 1.168a.076.076 0 0 1-.071 0l-4.83-2.786A4.504 4.504 0 0 1 2.34 7.872zm16.597 3.855-5.833-3.387L15.119 7.2a.076.076 0 0 1 .071 0l4.83 2.791a4.494 4.494 0 0 1-.676 8.105v-5.68a.79.79 0 0 0-.407-.667zm2.01-3.023-.141-.085-4.774-2.782a.776.776 0 0 0-.785 0L9.409 9.23V6.897a.066.066 0 0 1 .028-.061l4.83-2.787a4.5 4.5 0 0 1 6.68 4.66zm-12.64 4.135-2.02-1.164a.08.08 0 0 1-.038-.057V6.075a4.5 4.5 0 0 1 7.375-3.453l-.142.08L8.704 5.46a.795.795 0 0 0-.393.681zm1.097-2.365 2.602-1.5 2.607 1.5v2.999l-2.597 1.5-2.607-1.5z"/>
    </symbol>

    <!-- Anthropic / Claude · two-prong sunburst mark -->
    <symbol id="logo-claude" viewBox="0 0 24 24">
      <path fill="#D97757" d="M4.709 15.955 9.3 13.377l.078-.224-.076-.123H9.076l-.77-.048-2.632-.072-2.281-.094-2.21-.118L.628 12.58 0 11.811l.059-.389.54-.364.775.065 1.707.118 2.562.18 1.858.11 2.754.285h.437l.061-.175-.148-.109-.116-.109-2.636-1.787-2.854-1.888-1.495-1.084L2.6 6.073l-.412-.52-.176-1.13.736-.8.985.068.253.07.998.772 2.134 1.653 2.785 2.051.414.34.166-.117.02-.086-.186-.312-1.558-2.811-1.666-2.85-.738-1.185-.195-.714a3.415 3.415 0 0 1-.119-.843L6.154.028l.43-.427L7.58 0l.301.122.431.83.704 1.585 1.089 2.425 1.688 3.344.497.98.257.906.107.271h.181v-.119l.152-2.102.278-2.561.237-2.972.064-.717.405-.986.808-.535.642.302.522.741-.073.488-.315 2.052-.628 3.243-.403 2.186h.223l.243-.254 1.002-1.329 1.693-2.136.745-.84.881-.94.55-.44h1.055l.779.573.299.808-.106.54-.6.842-1.056 1.486-1.509 2.059-.89 1.488.077.121.202-.024 3.093-.665 1.705-.302 2.017-.343.915.398.079.58-.457.49-2.867.655-3.396.634-5.073 1.19-.017.01.03.04 1.93.182.823.048h2.04l3.795.283.993.647.597.806-.104.614-1.515.781-2.029-.483-4.74-1.13-1.622-.406h-.223v.132l1.35 1.32 2.488 2.254 3.096 2.874.158.721-.407.562-.432-.062-2.801-2.104-1.082-.95-2.447-2.065h-.156v.21l.567.833 2.982 4.485.152 1.376-.22.448-.782.274-.86-.157-1.764-2.485-1.825-2.793-1.474-2.514-.179.104-.864 9.302-.402.478-.937.357-.779-.59-.412-.956.412-1.893.499-2.47.405-1.965.366-2.44.21-.81-.016-.052-.175.024-1.824 2.497L2.254 20.72l-1.471 1.572-.354.137-.611-.32.058-.568.341-.501 2.015-2.553 1.214-1.594.785-.916-.005-.131h-.046L.28 18.529l-.765-.99.1-.765.203-.216 1.692-.324z"/>
    </symbol>

    <!-- Google Gemini · four-point sparkle with gradient -->
    <symbol id="logo-gemini" viewBox="0 0 24 24">
      <defs>
        <linearGradient id="gemGrad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#1C7DFF"/>
          <stop offset=".52" stop-color="#1C69FF"/>
          <stop offset="1" stop-color="#F0DCD6"/>
        </linearGradient>
      </defs>
      <path fill="url(#gemGrad)" d="M12 24A14.3 14.3 0 0 0 0 12 14.3 14.3 0 0 0 12 0a14.3 14.3 0 0 0 12 12 14.3 14.3 0 0 0-12 12Z"/>
    </symbol>

    <!-- Perplexity · teal rounded answer mark -->
    <symbol id="logo-perplexity" viewBox="0 0 24 24">
      <rect width="24" height="24" rx="6" fill="#20808D"/>
      <path fill="#fff" d="M12 5.5v5.2l4.1-3.3v9.1l-4.1-3.3v4.3l-1.5-.001V13l-4.1 3.3V7.4L10.5 10.7V5.5H12ZM10.5 12.55l-3.12 2.53V9.43L10.5 12Zm1.5 0L15.12 9.43v5.65L12 12.55Z"/>
    </symbol>

    <!-- Grok · simple X-style mark -->
    <symbol id="logo-grok" viewBox="0 0 24 24">
      <rect width="24" height="24" rx="6" fill="#0B0B0B"/>
      <path fill="#fff" d="m6.2 6.2 5 5-5 6.6h2.6l3.7-4.9 4.9 4.9h2.4l-6.1-6.1 5.8-7.6h-2.6L12.6 9.2 9.5 6.2H6.2Z"/>
    </symbol>

    <!-- Copilot · teal ring (for future use) -->
    <symbol id="logo-copilot" viewBox="0 0 24 24">
      <path fill="#0A7B8A" d="M12 2a10 10 0 1 0 10 10h-3a7 7 0 1 1-7-7V2Z"/>
      <circle cx="17" cy="7" r="2" fill="#22C0D2"/>
    </symbol>
  </defs>
</svg>

</head><body>

<div class="row"><span class="label">Platforms</span>
  <div class="chip"><svg class="logo"><use href="#logo-chatgpt"/></svg>ChatGPT</div>
  <div class="chip"><svg class="logo"><use href="#logo-claude"/></svg>Claude</div>
  <div class="chip"><svg class="logo"><use href="#logo-gemini"/></svg>Gemini</div>
  <div class="chip"><svg class="logo"><use href="#logo-perplexity"/></svg>Perplexity</div>
  <div class="chip"><svg class="logo"><use href="#logo-grok"/></svg>Grok</div>
  <div class="chip sel"><span class="allbadge">5</span>All platforms</div>
</div>

<div class="row"><span class="label">Share of voice · stacked</span>
  <div class="bar">
    <div class="seg" style="background:#10A37F;width:34%"><svg class="logo"><use href="#logo-chatgpt"/></svg>ChatGPT 34%</div>
    <div class="seg" style="background:#D97757;width:22%"><svg class="logo"><use href="#logo-claude"/></svg>Claude 22%</div>
    <div class="seg" style="background:#1C69FF;width:18%"><svg class="logo"><use href="#logo-gemini"/></svg>Gemini 18%</div>
    <div class="seg" style="background:#20808D;width:14%"><svg class="logo"><use href="#logo-perplexity"/></svg>Ppx 14%</div>
    <div class="seg" style="background:#0B0B0B;width:12%"><svg class="logo"><use href="#logo-grok"/></svg>Grok</div>
  </div>
</div>

<div class="row"><span class="label">Citation card</span>
  <div style="display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--border-subtle);border-radius:var(--borderRadius-300);background:#fff;width:100%">
    <svg style="width:24px;height:24px;flex-shrink:0"><use href="#logo-claude"/></svg>
    <div style="flex:1;font-family:var(--fontFamily-body);font-size:13px;color:var(--content-default);line-height:1.4">Claude 4.5 cited <b style="font-weight:600">birdseyepost.com</b> in response to <span style="color:var(--color-purple-500)">"best AI SEO tools 2026"</span></div>
    <span style="font-family:var(--font-mono);font-size:11px;color:var(--content-subtlest)">2m ago</span>
  </div>
</div>

<div class="row"><span class="label">Icon only · 20px · pair with counts</span>
  <div style="display:flex;gap:18px;align-items:center">
    <div style="display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:12px;color:var(--content-default)"><svg style="width:18px;height:18px"><use href="#logo-chatgpt"/></svg>1,284</div>
    <div style="display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:12px;color:var(--content-default)"><svg style="width:18px;height:18px"><use href="#logo-claude"/></svg>842</div>
    <div style="display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:12px;color:var(--content-default)"><svg style="width:18px;height:18px"><use href="#logo-gemini"/></svg>693</div>
    <div style="display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:12px;color:var(--content-default)"><svg style="width:18px;height:18px"><use href="#logo-perplexity"/></svg>521</div>
    <div style="display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:12px;color:var(--content-default)"><svg style="width:18px;height:18px"><use href="#logo-grok"/></svg>412</div>
  </div>
</div>

</body></html>
