<!doctype html><html><head><meta charset="utf-8">
<title>Components — Toggles</title>
<link rel="stylesheet" href="_base.css">
<style>
  body { padding:24px; display:flex; flex-direction:column; gap:16px; }
  .head h1 { font-family:var(--fontFamily-headings); font-weight:700; font-size:18px; letter-spacing:-0.16px; }
  .head .s { font-family:var(--fontFamily-body); font-size:12px; color:#616163; margin-top:4px; }
  .grp { font-family:var(--fontFamily-headings); font-weight:600; font-size:10px; text-transform:uppercase; letter-spacing:0.12em; color:#7e7e80; }
  .row { display:flex; gap:16px; align-items:center; flex-wrap:wrap; padding-top:6px; }

  /* Switch — bg goes purple-500 when on (never black) */
  .switch { width:36px; height:20px; border-radius:99px; background:#cbcbcf; position:relative; cursor:pointer; transition:.15s; }
  .switch::after { content:""; position:absolute; width:16px; height:16px; border-radius:99px; background:#fff; top:2px; left:2px; transition:.15s; box-shadow:0 1px 2px rgba(0,0,0,.2); }
  .switch.on { background:#6d65e1; }
  .switch.on::after { left:18px; }
  .switch.disabled { opacity:.5; pointer-events:none; }

  /* Checkbox */
  .chk { width:18px; height:18px; border-radius:4px; border:1.5px solid #cbcbcf; background:#fff; display:inline-flex; align-items:center; justify-content:center; }
  .chk.on { background:#6d65e1; border-color:#6d65e1; }
  .chk.on svg { color:#fff; }
  .chk.ind { background:#6d65e1; border-color:#6d65e1; }
  .chk.ind::after { content:""; width:10px; height:2px; background:#fff; border-radius:1px; }

  /* Radio */
  .radio { width:18px; height:18px; border-radius:99px; border:1.5px solid #cbcbcf; background:#fff; display:inline-flex; align-items:center; justify-content:center; }
  .radio.on { border-color:#6d65e1; border-width:5px; }

  /* Segmented */
  .seg { display:inline-flex; background:rgba(97,97,99,.10); border-radius:8px; padding:3px; gap:2px; }
  .seg button { font-family:var(--fontFamily-headings); font-weight:600; font-size:12px; letter-spacing:-0.12px; padding:5px 12px; background:transparent; color:#464649; border:0; border-radius:6px; cursor:pointer; }
  .seg button.on { background:#fff; color:#161518; box-shadow:0 1px 2px rgba(0,0,0,.08); }

  /* Tabs */
  .tabs { display:inline-flex; gap:0; border-bottom:1px solid #e4e4e4; }
  .tabs button { font-family:var(--fontFamily-headings); font-weight:500; font-size:13px; letter-spacing:-0.14px; padding:8px 14px; background:transparent; color:#7e7e80; border:0; border-bottom:2px solid transparent; cursor:pointer; margin-bottom:-1px; }
  .tabs button.on { color:#161518; font-weight:600; border-bottom-color:#6d65e1; }
  .tabs button:hover:not(.on) { color:#161518; }

  .item { display:inline-flex; align-items:center; gap:8px; font-family:var(--fontFamily-body); font-size:13px; color:#161518; }
</style>
</head>
<body>

<div class="head">
  <h1>Toggles, checkboxes, radios, tabs</h1>
  <div class="s">"On" states use purple-500. Never black fills — black is reserved for <span class="mono">bg-inverse</span>.</div>
</div>

<div class="grp">Switch</div>
<div class="row">
  <div class="item"><div class="switch"></div>Off</div>
  <div class="item"><div class="switch on"></div>Daily digest</div>
  <div class="item"><div class="switch on disabled"></div>Locked by admin</div>
</div>

<div class="grp">Checkbox</div>
<div class="row">
  <div class="item"><span class="chk"></span>Include draft posts</div>
  <div class="item"><span class="chk on"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></span>Monitor competitors</div>
  <div class="item"><span class="chk ind"></span>Some platforms</div>
</div>

<div class="grp">Radio</div>
<div class="row">
  <div class="item"><span class="radio"></span>Weekly</div>
  <div class="item"><span class="radio on"></span>Real-time</div>
  <div class="item"><span class="radio"></span>Monthly</div>
</div>

<div class="grp">Segmented control · pill</div>
<div class="row">
  <div class="seg">
    <button class="on">All</button>
    <button>ChatGPT</button>
    <button>Claude</button>
    <button>Gemini</button>
    <button>Perplexity</button>
  </div>
</div>

<div class="grp">Tabs · underline</div>
<div class="row">
  <div class="tabs">
    <button class="on">Overview</button>
    <button>Recommendations</button>
    <button>Competitors</button>
    <button>Citations</button>
    <button>Settings</button>
  </div>
</div>

</body></html>
