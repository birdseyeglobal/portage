<!doctype html><html><head><meta charset="utf-8">
<title>Logo — lockups</title><link rel="stylesheet" href="_base.css">
<style>
  body{padding:0;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--color-grey-100)}
  .cell{display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;padding:var(--spacing-900) var(--spacing-500);min-height:180px}
  .cell.dark{background:var(--color-grey-1000)}
  .cell.light{background:#ffffff}
  .cell.lav{background:var(--color-purple-100)}
  .cell.ink{background:var(--color-grey-800)}
  .cell.nope{background:var(--color-orange-300);position:relative;overflow:hidden}
  .cell.nope::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,transparent calc(50% - 1px),var(--color-red-500) 50%,transparent calc(50% + 1px));opacity:.85}
  .cell.nope .nope-ring{position:absolute;inset:10px;border:2px solid var(--color-red-500);border-radius:var(--borderRadius-200)}
  img{max-width:220px;max-height:64px;display:block}
  .icn{max-width:56px;max-height:56px}
  .lbl{font-family:var(--fontFamily-headings);font-weight:var(--fontWeight-medium);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
  .light .lbl,.lav .lbl{color:var(--color-grey-400)}
  .ink .lbl,.dark .lbl{color:var(--color-grey-300)}
  .nope .lbl{color:var(--color-red-700);font-weight:var(--fontWeight-bold);position:relative;z-index:2;background:#fff;padding:4px 10px;border-radius:var(--borderRadius-100)}
</style></head><body>
<div class="cell light"><img src="../assets/yolando-full-dark.svg" alt=""><span class="lbl">Full · light BG</span></div>
<div class="cell dark"><img src="../assets/yolando-full-light.svg" alt=""><span class="lbl">Full · dark BG</span></div>
<div class="cell light"><img class="icn" src="../assets/yolando-icon-dark.svg" alt=""><span class="lbl">Icon · light</span></div>
<div class="cell dark"><img class="icn" src="../assets/yolando-icon-light.svg" alt=""><span class="lbl">Icon · dark</span></div>
<div class="cell lav"><img src="../assets/yolando-full-dark.svg" alt=""><span class="lbl">Full · purple-100</span></div>
<div class="cell ink"><img src="../assets/yolando-full-light.svg" alt=""><span class="lbl">Full · grey-800</span></div>
<div class="cell nope" style="grid-column:span 2"><img src="../assets/yolando-full-dark.svg" alt="" style="position:relative;z-index:2;opacity:.4"><span class="nope-ring"></span><span class="lbl">Never · orange / peach backgrounds</span></div>
</body></html>
