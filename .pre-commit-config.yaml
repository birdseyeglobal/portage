repos:
  - repo: https://github.com/biomejs/pre-commit
    rev: v1.9.4
    hooks:
      - id: biome-check
        additional_dependencies: ["@biomejs/biome@1.9.4"]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [markdown]
        exclude: ^(LICENSE|plugins/.*/references/|node_modules/|\.claude/|\.agents/)

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.14.0
    hooks:
      - id: markdownlint-cli2
        exclude: ^(LICENSE|plugins/.*/references/|node_modules/|\.claude/|\.agents/)

  - repo: local
    hooks:
      - id: validate-skill-frontmatter
        name: Validate SKILL.md frontmatter
        entry: scripts/validate-skill-frontmatter.py
        language: python
        files: ^plugins/.*/skills/.*/SKILL\.md$
        pass_filenames: false

      - id: link-marketplace-skills
        name: Link marketplace skills (.claude/skills + .agents/skills)
        entry: scripts/link-marketplace-skills.sh
        language: script
        files: ^plugins/.*/skills/
        pass_filenames: false
