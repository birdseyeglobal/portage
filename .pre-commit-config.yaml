repos:
  - repo: local
    hooks:
      - id: biome
        name: Biome (JSON format + lint)
        entry: npx --no-install biome check --write
        language: system
        files: \.(json|jsonc)$
        exclude: ^(node_modules/|\.claude/|\.agents/|plugins/.*/references/|package-lock\.json)

      - id: prettier
        name: Prettier (Markdown)
        entry: npx --no-install prettier --write
        language: system
        files: \.md$
        exclude: ^(node_modules/|\.claude/|\.agents/|plugins/.*/references/|LICENSE|.*/CLAUDE\.md)

      - id: markdownlint
        name: markdownlint-cli2
        entry: npx --no-install markdownlint-cli2
        language: system
        files: \.md$
        exclude: ^(node_modules/|\.claude/|\.agents/|plugins/.*/references/|LICENSE|.*/CLAUDE\.md)

      - id: validate-skill-frontmatter
        name: Validate SKILL.md frontmatter
        entry: scripts/validate-skill-frontmatter.py
        language: system
        files: ^plugins/.*/skills/.*/SKILL\.md$
        pass_filenames: false

      - id: link-marketplace-skills
        name: Link marketplace skills (.claude/skills + .agents/skills)
        entry: scripts/link-marketplace-skills.sh
        language: system
        files: ^plugins/.*/skills/
        pass_filenames: false
